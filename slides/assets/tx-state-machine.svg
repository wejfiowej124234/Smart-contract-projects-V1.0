<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .title { fill: #e6edf3; font: 800 44px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .subtitle { fill: #9da7b3; font: 600 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .node { fill: #111a33; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .node2 { fill: #0f1a2a; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .h { fill: #c9d1d9; font: 800 26px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t { fill: #9da7b3; font: 500 20px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .a { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#m); }
      .b { stroke: #7ee787; stroke-width: 4; fill: none; marker-end: url(#m2); }
      .c { stroke: #ff7b72; stroke-width: 4; fill: none; marker-end: url(#m3); }
      .muted { stroke: #8b949e; stroke-width: 3; fill: none; marker-end: url(#m4); opacity: 0.7; }
      .small { fill: #8b949e; font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#58a6ff"/></marker>
    <marker id="m2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7ee787"/></marker>
    <marker id="m3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#ff7b72"/></marker>
    <marker id="m4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b949e"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />

  <text class="title" x="80" y="92">Transaction Lifecycle State Machine</text>
  <text class="subtitle" x="80" y="132">Handle wallet uncertainty, long pending, replacement, and RPC eventual consistency</text>

  <rect class="node" x="120" y="250" width="320" height="120" />
  <text class="h" x="160" y="300">idle</text>
  <text class="t" x="160" y="336">ready for user action</text>

  <rect class="node" x="520" y="250" width="340" height="120" />
  <text class="h" x="560" y="300">signing</text>
  <text class="t" x="560" y="336">wallet prompt shown</text>

  <rect class="node" x="940" y="250" width="360" height="120" />
  <text class="h" x="980" y="300">pending</text>
  <text class="t" x="980" y="336">tx hash acquired + wait(N conf)</text>

  <rect class="node2" x="940" y="430" width="360" height="120" />
  <text class="h" x="980" y="480">stuck</text>
  <text class="t" x="980" y="516">timeout — allow manual re-check</text>

  <rect class="node" x="520" y="610" width="340" height="120" />
  <text class="h" x="560" y="660">confirmed</text>
  <text class="t" x="560" y="696">receipt ok + post-state verify</text>

  <rect class="node" x="120" y="610" width="320" height="120" />
  <text class="h" x="160" y="660">failed</text>
  <text class="t" x="160" y="696">revert / rejected / error</text>

  <!-- arrows main -->
  <path class="a" d="M440 310 L520 310" />
  <text class="small" x="450" y="290">click action</text>

  <path class="a" d="M860 310 L940 310" />
  <text class="small" x="860" y="290">tx sent</text>

  <path class="b" d="M1120 370 C1120 440, 820 520, 690 610" />
  <text class="small" x="980" y="600">confirmed</text>

  <path class="c" d="M560 370 C560 470, 320 530, 280 610" />
  <text class="small" x="430" y="520">user rejected / error</text>

  <path class="c" d="M1120 370 C1120 420, 1120 420, 1120 430" />
  <text class="small" x="1140" y="420">timeout</text>

  <path class="muted" d="M1120 550 C1120 640, 940 710, 860 710" />
  <text class="small" x="1040" y="720">manual re-check / clear</text>

  <path class="muted" d="M940 310 C860 310, 860 310, 860 310" />

  <!-- replacement note -->
  <rect class="node2" x="520" y="430" width="340" height="120" />
  <text class="h" x="560" y="480">replacement</text>
  <text class="t" x="560" y="516">speed up → track new hash</text>

  <path class="muted" d="M1120 370 C1120 430, 900 470, 860 490" />
  <text class="small" x="980" y="460">TRANSACTION_REPLACED</text>

  <path class="muted" d="M690 550 C690 590, 690 590, 690 610" />

  <text class="subtitle" x="80" y="840">Key idea: a tx is a lifecycle, not a single async call.</text>
</svg>
