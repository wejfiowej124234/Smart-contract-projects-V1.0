<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .title { fill: #e6edf3; font: 700 44px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .label { fill: #c9d1d9; font: 600 24px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .text { fill: #9da7b3; font: 500 20px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .box { fill: #111a33; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .box2 { fill: #0f1a2a; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .pill { fill: #132042; stroke: #2a3a66; stroke-width: 2; rx: 999; }
      .arrow { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#m); opacity: 0.95; }
      .arrow2 { stroke: #7ee787; stroke-width: 4; fill: none; marker-end: url(#m2); opacity: 0.95; }
      .muted { stroke: #8b949e; stroke-width: 3; fill: none; marker-end: url(#m3); opacity: 0.7; }
      .small { fill: #8b949e; font: 600 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#58a6ff" />
    </marker>
    <marker id="m2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7ee787" />
    </marker>
    <marker id="m3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8b949e" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />

  <text class="title" x="80" y="92">System Architecture (Hardhat + React + ethers v6)</text>
  <text class="text" x="80" y="132">Local chain (31337), one-click deploy + export artifacts, event-driven UI refresh</text>

  <!-- Hardhat box -->
  <rect class="box" x="80" y="190" width="520" height="520" rx="18" />
  <text class="label" x="120" y="235">Hardhat Workspace</text>
  <text class="small" x="120" y="270">contracts / scripts / tests</text>

  <rect class="box2" x="120" y="310" width="440" height="96" rx="16" />
  <text class="label" x="150" y="350">Contracts</text>
  <text class="text" x="150" y="382">SimpleLending.sol + TestToken.sol</text>

  <rect class="box2" x="120" y="430" width="440" height="104" rx="16" />
  <text class="label" x="150" y="472">Deploy + Seed + Export</text>
  <text class="text" x="150" y="504">scripts/deploy.ts + _lib/export.ts</text>

  <rect class="pill" x="120" y="560" width="440" height="64" rx="999" />
  <text class="label" x="150" y="602">Artifacts Output</text>
  <text class="small" x="380" y="602">ABI + addresses</text>

  <!-- Chain box -->
  <rect class="box" x="660" y="190" width="420" height="250" rx="18" />
  <text class="label" x="700" y="235">Hardhat Local Chain</text>
  <text class="text" x="700" y="270">JSON-RPC: http://127.0.0.1:8545</text>
  <text class="text" x="700" y="302">chainId: 31337</text>

  <rect class="box2" x="700" y="330" width="340" height="80" rx="16" />
  <text class="label" x="730" y="364">On-chain State</text>
  <text class="text" x="730" y="395">supply / borrow / events</text>

  <!-- Frontend box -->
  <rect class="box" x="660" y="480" width="860" height="230" rx="18" />
  <text class="label" x="700" y="525">Frontend (React + TypeScript)</text>
  <text class="small" x="700" y="560">ethers v6 + MetaMask (EIP-1193)</text>

  <rect class="box2" x="700" y="585" width="380" height="96" rx="16" />
  <text class="label" x="730" y="625">Read model</text>
  <text class="text" x="730" y="656">useDashboard (provider)</text>

  <rect class="box2" x="1100" y="585" width="380" height="96" rx="16" />
  <text class="label" x="1130" y="625">Write model</text>
  <text class="text" x="1130" y="656">useActions (signer) + tx state</text>

  <!-- MetaMask pill -->
  <rect class="pill" x="1140" y="190" width="380" height="92" rx="999" />
  <text class="label" x="1180" y="235">MetaMask</text>
  <text class="text" x="1180" y="265">sign / switch chain / accounts</text>

  <!-- Arrows -->
  <path class="arrow" d="M560 480 C610 460, 610 340, 660 330" />
  <text class="small" x="540" y="440">deploy tx</text>

  <path class="arrow2" d="M560 592 C610 592, 610 592, 700 632" />
  <text class="small" x="520" y="610">export ABIs + addresses</text>

  <path class="arrow" d="M1080 630 C1120 630, 1120 350, 1080 350" />
  <text class="small" x="1040" y="520">JSON-RPC reads</text>

  <path class="arrow" d="M1100 630 C1120 630, 1120 370, 1080 370" />

  <path class="arrow" d="M1290 282 C1290 350, 1290 450, 1290 585" />
  <text class="small" x="1310" y="420">wallet signing</text>

  <path class="muted" d="M900 410 C900 450, 900 450, 900 585" />
  <text class="small" x="920" y="520">events</text>

  <!-- Footer note -->
  <text class="text" x="80" y="820">Key idea: reproducible demo loop + strong UX reliability (confirmed refresh + event listener + fail-safe).</text>
</svg>
