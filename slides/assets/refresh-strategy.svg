<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .title { fill: #e6edf3; font: 800 44px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .subtitle { fill: #9da7b3; font: 600 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .box { fill: #111a33; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .box2 { fill: #0f1a2a; stroke: #2a3a66; stroke-width: 2; rx: 18; }
      .h { fill: #c9d1d9; font: 800 26px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .t { fill: #9da7b3; font: 500 20px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .a { stroke: #7ee787; stroke-width: 4; fill: none; marker-end: url(#m2); }
      .b { stroke: #58a6ff; stroke-width: 4; fill: none; marker-end: url(#m); }
      .c { stroke: #8b949e; stroke-width: 3; fill: none; marker-end: url(#m3); opacity: 0.8; }
      .small { fill: #8b949e; font: 700 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#58a6ff"/></marker>
    <marker id="m2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7ee787"/></marker>
    <marker id="m3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8b949e"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />

  <text class="title" x="80" y="92">UI Refresh Strategy (3 layers)</text>
  <text class="subtitle" x="80" y="132">Event-first (mandatory) with pragmatic fail-safe to avoid demo flakiness</text>

  <rect class="box" x="100" y="210" width="1400" height="600" rx="18" />

  <rect class="box2" x="160" y="280" width="520" height="160" rx="16" />
  <text class="h" x="200" y="330">Layer 1 — Confirmed refresh</text>
  <text class="t" x="200" y="366">After tx.wait(N): force refresh</text>
  <text class="t" x="200" y="398">Goal: deterministic UX after user action</text>

  <rect class="box2" x="160" y="480" width="520" height="180" rx="16" />
  <text class="h" x="200" y="530">Layer 2 — Contract events (mandatory)</text>
  <text class="t" x="200" y="566">Listen Supplied/Withdrawn/Borrowed/Repaid</text>
  <text class="t" x="200" y="598">Throttle bursts (e.g., 250ms)</text>
  <text class="t" x="200" y="630">Goal: meet assignment + real-time UI</text>

  <rect class="box2" x="760" y="380" width="660" height="280" rx="16" />
  <text class="h" x="800" y="430">Layer 3 — Fail-safe (optional)</text>
  <text class="t" x="800" y="466">Throttled block listener (~3s) triggers refresh</text>
  <text class="t" x="800" y="498">Plus best-effort backfill (small queryFilter range)</text>
  <text class="t" x="800" y="530">Goal: handle provider reconnect / missed events</text>

  <!-- arrows into dashboard refresh -->
  <rect class="box2" x="760" y="280" width="660" height="80" rx="16" />
  <text class="h" x="800" y="330">Dashboard refresh()</text>
  <text class="t" x="1120" y="330">Promise.all reads</text>

  <path class="a" d="M680 360 C740 360, 740 320, 760 320" />
  <text class="small" x="650" y="340">after confirm</text>

  <path class="b" d="M680 570 C740 570, 740 340, 760 340" />
  <text class="small" x="650" y="560">events</text>

  <path class="c" d="M1090 660 C1090 710, 1090 710, 1090 360" />
  <text class="small" x="1110" y="700">fail-safe</text>

  <text class="subtitle" x="80" y="850">Why this matters: avoid the classic demo failure “chain updated but UI didn’t”.</text>
</svg>
